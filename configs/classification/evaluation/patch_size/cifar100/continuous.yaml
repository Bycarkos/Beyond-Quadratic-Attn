# @package _global_

# Patch-size robustness evaluation of the trained continuous dim768 CIFAR-100 model.
# Model inputs and checkpoint_path come from its training config.
defaults:
  - /ssog/cifar100/fixed_r4_nfe12@_global_
  - _self_

evaluation:
  model: continuous
  checkpoint: best          # best | last | /path/to/file.ckpt
  patch_sizes: [16, 14, 8]
  geometry: [token, image]
  batch_size: 128
  num_workers: 8
  output_dir: experiments/SSOG/patch_size_eval/cifar100
