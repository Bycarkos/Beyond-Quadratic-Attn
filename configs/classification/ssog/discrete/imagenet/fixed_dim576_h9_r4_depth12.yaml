# @package _global_

defaults:
  - /ssog/discrete/base_imagenet@_global_
  - _self_



setup:
  hardware:
    devices: 1
    strategy: auto
    
  experiment:
    seed: 42
    recover_from_checkpoint: false
    accumulation_steps: 2
  wandb:
    name: imagenet-discrete-ssog-dim576-h9-r4-depth12-seed42

modeling:
  inputs:
    dim: 576
    num_heads: 9

data:
  collator:
    train:
      shuffle: true
      batch_size: 512
      pin_memory: true
      num_workers: 4
      drop_last: true
