# @package _global_

defaults:
  - /ssog/discrete/base_imagenet@_global_
  - _self_

setup:

  hardware:
    devices: 4
    strategy: ddp
    
  experiment:
    seed: 42
    recover_from_checkpoint: false
    accumulation_steps: 2
  wandb:
    name: imagenet-discrete-ssog-dim768-h12-r4-depth12-seed42

data:
  collator:
    train:
      shuffle: true
      batch_size: 128
      pin_memory: true
      num_workers: 4
      drop_last: true
