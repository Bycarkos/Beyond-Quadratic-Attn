# @package _global_

# Matched ViT/bViT ImageNet recipe based on arXiv:2605.10661.
# A40-friendly microbatching preserves the paper's global batch size:
# 64 images/GPU * 4 GPUs * 4 accumulation steps = 1024.
log_wandb: true

setup:
  hardware:
    devices: 4
    strategy: ddp
    precision: 16-mixed
  experiment:
    epochs: 300
    accumulation_steps: 4
    log_every: 20
    seed: 42
    recover_from_checkpoint: false
    start_epoch: 0
    gradient_clip_val: 0.0
  optimizer:
    type: adamw
    lr: 5e-4
    weight_decay: 5e-2
    betas: [0.9, 0.999]
    eps: 1e-8
  scheduler:
    type: cosine
    warmup_epochs: 30
    warmup_start_factor: 0.033
    decay_epochs: 300
    lr_end_factor: 0.0
  ema:
    enabled: true
    decay: 0.99995
  trainer: {}
  wandb:
    project: SSOG-Paper
    group: imagenet1k-matched-baselines
    name: override-me

data:
  augmentation:
    crop_scale: [0.08, 1.0]
    horizontal_flip_prob: 0.5
    randaugment_enabled: true
    randaugment_num_ops: 2
    randaugment_magnitude: 9
    random_erasing_prob: 0.25
    random_erasing_scale: [0.02, 0.2]
    random_erasing_ratio: [0.3, 3.3]
    random_erasing_value: random
    mixup_alpha: 0.8
    cutmix_alpha: 1.0
    cutmix_prob: 0.5
    mixup_prob: 1.0
    label_smoothing: 0.1
  dataset:
    num_classes: 1000
    name: ILSVRC/imagenet-1k
    dataset_path: ~/imagenet-1k
    download: false
  collator:
    train:
      shuffle: true
      batch_size: 64
      pin_memory: true
      num_workers: 4
      drop_last: true
    val:
      shuffle: false
      batch_size: 128
      pin_memory: true
      num_workers: 4
      drop_last: false
    test:
      shuffle: false
      batch_size: 1
      pin_memory: false
      num_workers: 0

modeling:
  compile: false
  inputs:
    dim: 768
    num_classes: ${data.dataset.num_classes}
    num_heads: 12
    patch_size: 16
    img_size: 224
    mlp_ratio: 4.0
    attn_drop: 0.0
    proj_drop: 0.0
    mlp_drop: 0.0
  checkpoint_path: ~/checkpoints/${setup.wandb.project}/${setup.wandb.group}/${setup.wandb.name}
  checkpoint_name: ${setup.wandb.name}

