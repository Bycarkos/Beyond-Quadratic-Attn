log_wandb: true

setup:
  hardware:
    devices: 4
    strategy: ddp
  experiment:
    epochs: 300
    # 32 samples/GPU * 4 GPUs * 2 accumulation steps = effective batch 256.
    accumulation_steps: 1
    log_every: 20
    curriculum_at: 0
    recover_from_checkpoint: false
    start_epoch: 0
  optimizer:
    lr: 5e-4
    weight_decay: 5e-2
    muon_lr: 5e-4
    betas: [0.9, 0.95]
    eps: 1e-8
  scheduler:
    type: cosine
    warmup_epochs: 5
    decay_epochs: 300
    min_lr: 5e-5
  trainer:
    num_visualization_samples: 4
    visualization_every_n_epochs: 10
    visualization_query: [7, 7]
    visualization_queries: [[3, 3], [3, 10], [7, 7], [10, 3], [10, 10]]
  wandb:
    project: SSOG-Paper
    group: imagenet1k
    name: override-me

data:
  augmentation:
    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    cutmix_prob: 0.5
    mixup_prob: 1.0
    label_smoothing: 0.1
  dataset:
    num_classes: 1000
    name: ILSVRC/imagenet-1k
    dataset_path: ~/imagenet-1k
    download: false
  collator:
    train:
      shuffle: true
      batch_size: 64
      pin_memory: true
      num_workers: 4
      drop_last: true
    val:
      shuffle: false
      batch_size: 128
      pin_memory: true
      num_workers: 8
      drop_last: false
    test:
      shuffle: false
      batch_size: 1
      pin_memory: false
      num_workers: 0

modeling:
  compile: false
  inputs:
    dim: 768
    num_classes: ${data.dataset.num_classes}
    num_heads: 12
    patch_size: 16
    img_size: 224
    mlp_ratio: 4
    num_eval_steps: 13
    return_error_upper_bound: false
    regularize: false
    attn_drop: 0.0
    proj_drop: 0.0
    mlp_drop: 0.0
    solver: euler
    num_atoms: 4
    lookat: false
    max_offset: 7.0
    cold_init: true
    sigma_floor: 0.25
    capture_attention: false
    has_cls_token: true
    use_custom_euler_loop: true
  checkpoint_path: ~/checkpoints/${setup.wandb.project}/${setup.wandb.group}/${setup.wandb.name}
  checkpoint_name: ${setup.wandb.name}
