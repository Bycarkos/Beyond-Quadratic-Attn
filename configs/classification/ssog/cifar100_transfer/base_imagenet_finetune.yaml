# @package _global_

defaults:
  - /ssog/base_cifar100@_global_
  - _self_

setup:
  hardware:
    devices: 1
    strategy: auto
  experiment:
    epochs: 100
    accumulation_steps: 1
    recover_from_checkpoint: false
    freeze_pretrained_backbone: false
  optimizer:
    lr: 3e-5
    muon_lr: 3e-5
    weight_decay: 5e-2
  scheduler:
    type: cosine
    warmup_epochs: 5
    decay_epochs: 100
    min_lr: 3e-6
  wandb:
    group: cifar100-transfer
    name: override-me

data:
  collator:
    train:
      batch_size: 256
    val:
      batch_size: 256

