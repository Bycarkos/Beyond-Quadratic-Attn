# Looped (recurrent) counterpart of ssog/discrete/base_cifar100.yaml: the
# same DiscreteSSOG_ViT class and training recipe, but with recurrent=true so
# a single SSOG block is shared and applied `depth` times, instead of `depth`
# independently-parameterized blocks. This is the SSOG analogue of the
# looped_transformer/bViT baseline -- one shared block, discrete-step
# repetition, no ODE solver, no TimeFiLM/time-conditioning.
log_wandb: true

setup:
  hardware:
    devices: 1
    strategy: auto
  experiment:
    epochs: 500
    accumulation_steps: 2
    log_every: 10
    curriculum_at: 0
    recover_from_checkpoint: false
    start_epoch: 0
  optimizer:
    lr: 5e-4
    weight_decay: 5e-2
    muon_lr: 5e-4
    betas: [0.9, 0.95]
    eps: 1e-8
  scheduler:
    type: cosine
    warmup_epochs: 5
    decay_epochs: 500
    min_lr: 5e-5
  trainer:
    num_visualization_samples: 4
    visualization_every_n_epochs: 10
    visualization_query: [7, 7]
    visualization_queries: [[3, 3], [3, 10], [7, 7], [10, 3], [10, 10]]
  wandb:
    project: SSOG-Paper
    group: cifar100
    name: SSOG-Cifar100-Looped-Base

data:
  augmentation:
    crop_scale: [0.4, 1.0]
    horizontal_flip_prob: 0.5
    randaugment_enabled: true
    randaugment_num_ops: 2
    randaugment_magnitude: 9
    random_erasing_prob: 0.25
    random_erasing_scale: [0.02, 0.2]
    random_erasing_ratio: [0.3, 3.3]
    random_erasing_value: random
    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    cutmix_prob: 0.5
    mixup_prob: 1.0
    label_smoothing: 0.1
  dataset:
    num_classes: 100
    name: cifar100
    dataset_path: ~/cifar
    download: false
  collator:
    train:
      shuffle: true
      batch_size: 64
      pin_memory: true
      num_workers: 4
      drop_last: true
    val:
      shuffle: false
      batch_size: 64
      pin_memory: true
      num_workers: 2
      drop_last: false
    test:
      shuffle: false
      batch_size: 1
      pin_memory: false
      num_workers: 0

modeling:
  compile: false
  inputs:
    dim: 768
    num_classes: ${data.dataset.num_classes}
    num_heads: 12
    patch_size: 16
    img_size: 224
    mlp_ratio: 4
    depth: 12
    proj_drop: 0.0
    mlp_drop: 0.0
    num_atoms: 4
    lookat: false
    max_offset: 7.0
    cold_init: true
    sigma_floor: 0.25
    capture_attention: false
    recurrent: true
  checkpoint_path: ~/checkpoints/${setup.wandb.project}/${setup.wandb.group}/${setup.wandb.name}
  checkpoint_name: ${setup.wandb.name}
