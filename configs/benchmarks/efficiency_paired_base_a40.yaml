model:
  dim: 768
  num_heads: 12
  patch_size: 16
  mlp_ratio: 4
  num_classes: 100
  num_eval_steps: 13  # Euler: 13 grid points produce NFE 12.
  solver: euler
  num_atoms: 4
  sigma_floor: 0.25
  ssog_lookat: false
  odevit_gated_attention: false
  vit_depth: 12

benchmark:
  models:
    - odevit_base_dense
    - odevit_base_ssog
    - vit_base_dense
    - vit_base_ssog
    - bvit_base_dense
    - bvit_base_ssog
  resolutions: [224, 384, 512, 640, 768, 1024]
  batch_sizes: [1, 8, 32]
  dtype: fp16
  warmup_iterations: 10
  measure_iterations: 50
  profile_flops: true

output:
  directory: experiments/SSOG/efficiency/paired_base_a40
